<!DOCTYPE html>
<html lang="en">
<head>
  <title>Suhitha Ganesh - Contact</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #7B2D2D;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Suhitha Ganesh</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<header class="text-white text-center py-4" style="background-color: #7B2D2D;">
  <h1 class="fw-bold">Get In Touch</h1>
</header>
<div class="text-end container mt-2">
  <button id="darkModeBtn" onclick="toggleDarkMode()" style="background-color:#7B2D2D; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">
    🌙 Dark Mode
  </button>
</div>
<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h4 class="mb-4">Get In Touch</h4>
        <form action="https://formspree.io/f/mzepgvvq" method="POST">
          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Your Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
          </div>
          <button type="submit" class="btn" style="background-color: #7B2D2D; color: white;">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-3" style="background-color: #7B2D2D; color: white;">
  <small><i>Copyright &copy; 2025 Suhitha Ganesh</i></small>
</footer>
<script>
function toggleDarkMode() {
  document.body.classList.toggle('light-mode');
  var btn = document.getElementById('darkModeBtn');
  if (document.body.classList.contains('light-mode')) {
    btn.textContent = '🌙 Dark Mode';
  } else {
    btn.textContent = '☀️ Light Mode';
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
